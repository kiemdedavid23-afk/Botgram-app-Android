name: Update package-lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lock
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Regenerate package-lock.json (sans installer, sans scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Check lock contains the new dependency
        run: |
          grep -q '"node_modules/react-native-blob-util"' package-lock.json \
            || { echo "::error::react-native-blob-util absent du lock."; exit 1; }
          grep -q '"version": "0.25.1"' package-lock.json \
            || { echo "::error::version 0.25.1 absente du lock."; exit 1; }

      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lock déjà à jour."
          else
            git commit -m "chore: update package-lock for react-native-blob-util 0.25.1"
            git push
          fi