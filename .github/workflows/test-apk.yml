name: Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install JS dependencies
        run: npm ci

      - name: Check API_URL secret
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Le secret API_URL est absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Generate android/ project (if missing)
        run: |
          if [ -d android ]; then
            echo "android/ existe deja : reutilise."
          else
            cd "$RUNNER_TEMP"
            npx --yes @react-native-community/cli@latest init Botgram \
              --version 0.88.0 \
              --package-name com.botgram \
              --title Botgram \
              --skip-install \
              --skip-git-init \
              --directory tpl
            cd "$GITHUB_WORKSPACE"
            cp -a "$RUNNER_TEMP/tpl/android" android
          fi
          ls android

      - name: Wire react-native-config and tune Gradle
        run: |
          APP=android/app/build.gradle
          if [ ! -f "$APP" ]; then
            echo "::error::android/app/build.gradle introuvable (modele Kotlin DSL ?). Envoyer les logs."
            exit 1
          fi
          if ! grep -q "dotenv.gradle" "$APP"; then
            sed -i '/apply plugin: "com.facebook.react"/a apply from: project(":react-native-config").projectDir.getPath() + "/dotenv.gradle"' "$APP"
          fi
          if ! grep -q "dotenv.gradle" "$APP"; then
            echo "::error::Impossible de brancher react-native-config dans app/build.gradle. Envoyer les logs."
            exit 1
          fi
          sed -i 's/-Xmx2048m/-Xmx4g/' android/gradle.properties

      - name: Write .env from secrets
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          printf 'API_URL=%s\nAPP_CHANNEL=direct\n' "$API_URL" > .env

      - name: Build release APK (signed with the debug key, for testing only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: botgram-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          if-no-files-found: error