name: Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install JS dependencies
        run: npm ci

      - name: Check API_URL secret
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Le secret API_URL est absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Generate android/ project (if missing)
        run: |
          if [ -d android ]; then
            echo "android/ existe deja : reutilise."
          else
            cd "$RUNNER_TEMP"
            npx --yes @react-native-community/cli@latest init Botgram \
              --version 0.88.0 \
              --package-name app.botsgram.dsi \
              --title Botgram \
              --skip-install \
              --skip-git-init \
              --directory tpl
            cd "$GITHUB_WORKSPACE"
            cp -a "$RUNNER_TEMP/tpl/android" android
          fi
          ls android

      - name: Install RN community CLI (required for autolinking)
        run: |
          CLI_VER=$(node -p "try{require(process.env.RUNNER_TEMP+'/tpl/package.json').devDependencies['@react-native-community/cli']||'latest'}catch(e){'latest'}")
          echo "CLI version: $CLI_VER"
          npm install --no-save --no-package-lock \
            "@react-native-community/cli@$CLI_VER" \
            "@react-native-community/cli-platform-android@$CLI_VER"

      - name: Wire react-native-config and tune Gradle
        run: |
          APP=android/app/build.gradle
          if [ ! -f "$APP" ]; then
            echo "::error::android/app/build.gradle introuvable."
            exit 1
          fi
          if ! grep -q "dotenv.gradle" "$APP"; then
            sed -i '/apply plugin: "com.facebook.react"/a apply from: "../../node_modules/react-native-config/android/dotenv.gradle"' "$APP"
          fi
          grep -q "dotenv.gradle" "$APP" || { echo "::error::Cablage dotenv impossible."; exit 1; }
          if ! grep -q "org.gradle.caching" android/gradle.properties; then
            sed -i 's/-Xmx2048m/-Xmx4g/' android/gradle.properties
            {
              echo "org.gradle.parallel=true"
              echo "org.gradle.caching=true"
            } >> android/gradle.properties
          fi

      - name: Debug autolinking
        run: |
          echo "=== modules detectes par le CLI RN ==="
          npx react-native config | grep -E '"name"|"packageName"' || true
          test -f node_modules/react-native-config/android/dotenv.gradle

      - name: Write .env from secrets
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          printf 'API_URL=%s\nAPP_CHANNEL=direct\n' "$API_URL" > .env

      - name: Write fake google-services.json (test only, no real Firebase secret)
        run: |
          OUT=android/app/google-services.json
          echo "::notice::Faux google-services.json : les notifications push ne marcheront pas dans cet APK de test."
          printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"botgram-ci-placeholder","storage_bucket":"botgram-ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"app.botsgram.dsi"}},"api_key":[{"current_key":"placeholder"}]}],"configuration_version":"1"}' > "$OUT"
          jq -e '[.client[].client_info.android_client_info.package_name] | index("app.botsgram.dsi")' "$OUT" > /dev/null \
            || { echo "::error::Faux google-services.json invalide."; exit 1; }
          echo "google-services.json (faux) OK."

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (signed with the debug key, for testing only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: botgram-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          if-no-files-found: error