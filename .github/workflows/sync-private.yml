name: Sync vers le dépôt privé

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : montre le nombre de changements sans pousser"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-private
  cancel-in-progress: false

jobs:
  sync:
    # Garde-fou : on ne synchronise que la branche main du public
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérifier les secrets
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::Secret PRIVATE_REPO_TOKEN manquant."; exit 1; }
          [ -n "$REPO" ]  || { echo "::error::Secret PRIVATE_REPO manquant."; exit 1; }

      - name: Récupérer le dépôt public
        uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false

      - name: Récupérer le dépôt privé
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: private

      - name: Copier le public vers le privé (miroir, workflows exclus)
        run: |
          # --delete supprime dans le privé ce qui n'existe plus dans le public.
          # Les chemins exclus sont protégés : .github/workflows du privé (release.yml...) reste intact.
          rsync -a --delete \
            --exclude '/.git/' \
            --exclude '/.github/workflows/' \
            public/ private/

      - name: Voir les changements
        id: diff
        working-directory: private
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Le privé est déjà à jour."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --shortstat
          fi

      - name: Commit et push vers le privé
        if: ${{ steps.diff.outputs.changed == 'true' && !inputs.dry_run }}
        working-directory: private
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "sync: public@${SRC_SHA::7}"
          git push origin HEAD:main

      - name: Résumé
        run: |
          if [ "${{ steps.diff.outputs.changed }}" != "true" ]; then
            echo "Rien à synchroniser." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Simulation terminée : rien n'a été poussé." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Privé synchronisé avec public@${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          fi