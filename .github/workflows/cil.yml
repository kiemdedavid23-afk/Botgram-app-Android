name: Generer keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Alias de la cle"
        default: "botgram"
      dname:
        description: "Identite du certificat"
        default: "CN=Botgram, OU=DSI, O=DSI, L=Abidjan, C=CI"

permissions:
  contents: read
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.up.outputs.artifact-id }}
    steps:
      - name: Generer le keystore
        env:
          ALIAS: ${{ inputs.alias }}
          DNAME: ${{ inputs.dname }}
        run: |
          mkdir out
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -storetype PKCS12 \
            -keystore out/release.jks -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "$DNAME"
          base64 -w0 out/release.jks > out/ANDROID_KEYSTORE_BASE64.txt
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } > out/secrets.txt

      - name: Publier l'artefact
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: keystore-botgram
          path: out/
          retention-days: 1
          if-no-files-found: error

  purge:
    needs: generate
    if: always() && needs.generate.outputs.artifact_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Attendre 10 minutes puis supprimer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 600
          gh api -X DELETE \
            "repos/${{ github.repository }}/actions/artifacts/${{ needs.generate.outputs.artifact_id }}"
          echo "Artefact supprime."