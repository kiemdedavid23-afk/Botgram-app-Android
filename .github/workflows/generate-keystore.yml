name: Generate keystore

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commiter aussi le keystore dans le depot (depot PRIVE uniquement)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-keystore
  cancel-in-progress: false

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preconditions
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$STORE_PASS" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD absent. Le creer d'abord (12+ caracteres, lettres et chiffres)."
            exit 1
          fi
          if [ "${#STORE_PASS}" -lt 8 ]; then
            echo "::error::KEYSTORE_PASSWORD trop court (min 8 caracteres)."
            exit 1
          fi
          if [ -f keystore/botgram-release.jks ]; then
            echo "::error::keystore/botgram-release.jks existe deja dans le depot. Ne pas l'ecraser."
            exit 1
          fi
          if [ "${{ inputs.commit }}" = "true" ] && [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::error::Depot public : commit du keystore refuse."
            exit 1
          fi

      - name: Generate keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore out/botgram-release.jks \
            -alias botgram \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=Botgram, OU=Dev, O=Botgram, L=Abidjan, C=CI" > /dev/null
          base64 -w0 out/botgram-release.jks > out/keystore.b64
          printf 'alias: botgram\nmot de passe: voir le secret KEYSTORE_PASSWORD\nsecrets a creer: KEYSTORE_BASE64 (contenu de keystore.b64), KEY_ALIAS=botgram, KEY_PASSWORD=<meme mot de passe>\n' > out/INFO.txt
          keytool -list -keystore out/botgram-release.jks -storepass "$STORE_PASS" | head -8

      - name: Upload keystore (artifact, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: botgram-keystore
          path: out
          retention-days: 1
          if-no-files-found: error

      - name: Commit keystore (optional, private repo only)
        if: ${{ inputs.commit }}
        run: |
          mkdir -p keystore
          cp out/botgram-release.jks keystore/botgram-release.jks
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f keystore/botgram-release.jks
          git commit -m "chore: add release keystore"
          git push